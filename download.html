<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tải ModSkin — Bản mới nhất</title>
<meta name="description" content="Tải ModSkin miễn phí, an toàn, cập nhật mới nhất." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #07070c;
    --text: #f5f6fa;
    --muted: #9aa0b4;
    --border: rgba(255, 255, 255, 0.09);
    --primary: #7c5cff;
    --primary-2: #3b82f6;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px 18px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* ===== Background ===== */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    will-change: transform;
    animation: float 18s ease-in-out infinite;
  }
  .blob.a { width: 520px; height: 520px; background: #7c5cff; top: -170px; left: -130px; }
  .blob.b { width: 460px; height: 460px; background: #3b82f6; bottom: -190px; right: -110px; animation-delay: -6s; }
  .blob.c { width: 380px; height: 380px; background: #ec4899; top: 42%; left: 56%; opacity: 0.3; animation-delay: -12s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40px, -40px) scale(1.12); }
  }

  .grid-lines {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 15%, transparent 72%);
    mask-image: radial-gradient(ellipse at center, #000 15%, transparent 72%);
  }

  /* ===== Card ===== */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    padding: 46px 36px 34px;
    text-align: center;
    border-radius: 28px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.018));
    backdrop-filter: blur(26px) saturate(140%);
    -webkit-backdrop-filter: blur(26px) saturate(140%);
    box-shadow:
      0 40px 90px -30px rgba(0, 0, 0, 0.9),
      inset 0 1px 0 rgba(255, 255, 255, 0.09);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* Viền sáng trên cùng */
  .card::before {
    content: "";
    position: absolute;
    top: -1px; left: 12%; right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(140, 130, 255, .9), transparent);
    filter: blur(0.4px);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(26px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== Logo ===== */
  .logo {
    width: 88px;
    height: 88px;
    margin: 0 auto 24px;
    border-radius: 24px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #7c5cff, #3b82f6);
    box-shadow: 0 18px 44px -12px rgba(124, 92, 255, 0.9);
    animation: bob 4.5s ease-in-out infinite;
  }
  .logo svg { width: 42px; height: 42px; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  /* ===== Text ===== */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #b9b3ff;
    background: rgba(124, 92, 255, 0.13);
    border: 1px solid rgba(124, 92, 255, 0.3);
    padding: 6px 13px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  .badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #7c5cff;
    box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.7);
    animation: ping 2s ease-out infinite;
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.7); }
    70%  { box-shadow: 0 0 0 9px rgba(124, 92, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(124, 92, 255, 0); }
  }

  h1 {
    font-size: clamp(28px, 6vw, 34px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
    background: linear-gradient(180deg, #ffffff, #b9bed6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 380px;
    margin: 0 auto;
  }

  /* ===== Actions ===== */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 13px;
    margin-top: 32px;
  }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    height: 58px;
    padding: 0 22px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #fff;
    text-decoration: none;
    overflow: hidden;
    isolation: isolate;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.28s ease,
                background 0.28s ease,
                border-color 0.28s ease;
  }
  .btn svg { width: 21px; height: 21px; flex-shrink: 0; }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(-1px) scale(0.988); }

  /* Vệt sáng chạy qua */
  .btn::after {
    content: "";
    position: absolute;
    top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.38), transparent);
    transform: skewX(-18deg);
    transition: left 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    z-index: 2;
  }
  .btn:hover::after { left: 130%; }

  .btn-primary {
    background: linear-gradient(135deg, #7c5cff, #3b82f6);
    box-shadow: 0 16px 38px -12px rgba(92, 110, 255, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }
  .btn-primary:hover {
    box-shadow: 0 22px 48px -12px rgba(92, 110, 255, 1),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .btn-yt {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.11);
    color: #eef0f7;
  }
  .btn-yt:hover {
    background: rgba(255, 255, 255, 0.095);
    border-color: rgba(255, 255, 255, 0.22);
    box-shadow: 0 14px 32px -16px rgba(0, 0, 0, 0.9);
  }
  .btn-yt .yt-icon { color: #ff3b3b; }

  /* Ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    transform: scale(0);
    animation: ripple 0.65s ease-out forwards;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes ripple {
    to { transform: scale(3.4); opacity: 0; }
  }

  /* ===== Features ===== */
  .features {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 26px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 500;
    color: #b7bdd2;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.075);
    padding: 7px 12px;
    border-radius: 999px;
    transition: background 0.25s, color 0.25s;
  }
  .chip:hover { background: rgba(255, 255, 255, 0.085); color: #fff; }
  .chip svg { width: 14px; height: 14px; color: #4ade80; }

  .divider {
    height: 1px;
    margin: 26px 0 18px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
  }

  .note {
    font-size: 12.5px;
    color: #6f7590;
    line-height: 1.6;
  }
  .note strong { color: #9aa0b4; font-weight: 600; }

  /* ===== Stagger animation ===== */
  .stagger { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .d1 { animation-delay: 0.10s; }
  .d2 { animation-delay: 0.18s; }
  .d3 { animation-delay: 0.26s; }
  .d4 { animation-delay: 0.34s; }
  .d5 { animation-delay: 0.42s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Responsive ===== */
  @media (max-width: 420px) {
    .card { padding: 38px 22px 28px; border-radius: 24px; }
    .logo { width: 74px; height: 74px; border-radius: 20px; margin-bottom: 20px; }
    .logo svg { width: 36px; height: 36px; }
    .btn { height: 54px; font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <!-- Background -->
  <div class="bg" aria-hidden="true">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
  </div>
  <div class="grid-lines" aria-hidden="true"></div>

  <!-- Card -->
  <main class="card">

    <div class="logo stagger" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12" />
        <path d="m7 10 5 5 5-5" />
        <path d="M4 19h16" />
      </svg>
    </div>

    <span class="badge stagger d1"><span class="dot"></span> Bản mới nhất</span>

    <h1 class="stagger d2">Tải ModSkin</h1>

    <p class="subtitle stagger d3">
      Bản ModSkin chất lượng cao, cập nhật liên tục — miễn phí, an toàn và cài đặt cực nhanh.
    </p>

    <div class="actions stagger d4">
      <a class="btn btn-primary" href="https://link4m.net/sLVRHZ" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12" />
          <path d="m7 10 5 5 5-5" />
          <path d="M4 19h16" />
        </svg>
        Tải ModSkin
      </a>

      <a class="btn btn-yt" href="https://youtu.be/esHotdLbrDs" target="_blank" rel="noopener noreferrer">
        <svg class="yt-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/>
        </svg>
        Kênh YouTube
      </a>
    </div>

    <div class="features stagger d5">
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
        Miễn phí
      </span>
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
        An toàn
      </span>
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
        Cập nhật mới
      </span>
    </div>

    <div class="divider"></div>

    <p class="note">
      Nhấn <strong>Tải ModSkin</strong> để bắt đầu. Nếu gặp khó khăn, hãy xem
      <strong>video hướng dẫn</strong> trên kênh YouTube.
    </p>

  </main>

  <script>
    /* Hiệu ứng ripple khi bấm nút */
    document.querySelectorAll('.btn').forEach(function (btn) {
      btn.addEventListener('pointerdown', function (e) {
        var rect = btn.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height);
        var ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
        btn.appendChild(ripple);
        setTimeout(function () { ripple.remove(); }, 700);
      });
    });
  </script>

</body>
</html>
