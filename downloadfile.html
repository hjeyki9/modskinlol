<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HammzyySC — Mod Skin LoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Beaufort+for+LOL&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --gold-1:#f0e6d2;
    --gold-2:#c8aa6e;
    --gold-3:#785a28;
    --blue-1:#0ac8b9;
    --blue-2:#0596aa;
    --blue-3:#005a82;
    --bg-0:#010a13;
    --bg-1:#0a1428;
    --bg-2:#091428;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background:var(--bg-0);
    color:var(--gold-1);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== Background ===== */
  .bg{
    position:fixed;
    inset:0;
    z-index:-3;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(10,200,185,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(200,170,110,0.08), transparent 55%),
      linear-gradient(180deg, #010a13 0%, #091428 50%, #010a13 100%);
  }
  .bg::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(200,170,110,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,170,110,0.045) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:.45;
    z-index:-2;
    animation:float 14s ease-in-out infinite;
  }
  .orb.o1{ width:420px; height:420px; background:#0a5c6e; top:-120px; left:-120px; }
  .orb.o2{ width:360px; height:360px; background:#6b4c1a; bottom:-140px; right:-140px; animation-delay:-6s; }
  @keyframes float{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(30px,-30px,0) scale(1.08); }
  }

  /* ===== Layout ===== */
  .wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    position:relative;
  }

  .card{
    width:100%;
    max-width:520px;
    background:
      linear-gradient(180deg, rgba(10,20,40,0.92), rgba(1,10,19,0.94));
    border:1px solid rgba(200,170,110,0.22);
    border-radius:18px;
    padding:44px 34px 38px;
    position:relative;
    box-shadow:
      0 0 0 1px rgba(200,170,110,0.06) inset,
      0 30px 80px -20px rgba(0,0,0,0.9),
      0 0 60px -20px rgba(10,200,185,0.25);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    animation:rise .8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(28px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* corner ornaments */
  .card::before, .card::after{
    content:"";
    position:absolute;
    width:46px; height:46px;
    border:1.5px solid var(--gold-2);
    opacity:.55;
    pointer-events:none;
  }
  .card::before{ top:14px; left:14px; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }
  .card::after{ bottom:14px; right:14px; border-left:none; border-top:none; border-radius:0 0 8px 0; }

  /* ===== Avatar / Logo ===== */
  .logo{
    width:96px; height:96px;
    margin:0 auto 22px;
    border-radius:50%;
    display:grid;
    place-items:center;
    position:relative;
    background:radial-gradient(circle at 30% 30%, #1a3355, #04121f 70%);
    border:1.5px solid var(--gold-2);
    box-shadow:
      0 0 30px rgba(10,200,185,0.35),
      inset 0 0 22px rgba(10,200,185,0.18);
    animation:pulse 3.5s ease-in-out infinite;
  }
  .logo::after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:1px dashed rgba(200,170,110,0.35);
    animation:spin 18s linear infinite;
  }
  .logo svg{ width:52px; height:52px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 30px rgba(10,200,185,0.35), inset 0 0 22px rgba(10,200,185,0.18); }
    50%{ box-shadow:0 0 46px rgba(10,200,185,0.55), inset 0 0 26px rgba(10,200,185,0.28); }
  }

  /* ===== Title ===== */
  .brand{
    text-align:center;
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:clamp(26px, 6vw, 34px);
    letter-spacing:4px;
    background:linear-gradient(180deg, #fff5dc 0%, var(--gold-1) 35%, var(--gold-2) 65%, #8a6a2a 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 24px rgba(200,170,110,0.18);
  }
  .tagline{
    text-align:center;
    font-size:11px;
    letter-spacing:3.5px;
    text-transform:uppercase;
    color:rgba(200,170,110,0.75);
    margin-top:8px;
    margin-bottom:6px;
    font-weight:500;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0 28px;
    opacity:.7;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-2), transparent);
  }
  .divider span{
    width:6px; height:6px;
    transform:rotate(45deg);
    background:var(--gold-2);
    box-shadow:0 0 8px var(--gold-2);
  }

  /* ===== Buttons ===== */
  .actions{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 20px;
    border-radius:10px;
    text-decoration:none;
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing:1.5px;
    font-size:14px;
    text-transform:uppercase;
    overflow:hidden;
    isolation:isolate;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, border-color .3s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn .icon{
    width:38px; height:38px;
    flex:none;
    display:grid; place-items:center;
    border-radius:8px;
    background:rgba(0,0,0,0.28);
    border:1px solid rgba(255,255,255,0.10);
  }
  .btn .icon svg{ width:20px; height:20px; }
  .btn .label{ flex:1; }
  .btn .arrow{
    font-size:16px;
    opacity:.7;
    transition:transform .3s ease, opacity .3s ease;
  }

  /* Primary — Download */
  .btn.primary{
    color:#0a0f14;
    background:linear-gradient(135deg, #f0e6d2 0%, var(--gold-2) 55%, #a5854a 100%);
    border:1px solid #f0e6d2;
    box-shadow:
      0 10px 30px -8px rgba(200,170,110,0.55),
      inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .btn.primary::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.55) 50%, transparent 80%);
    transform:translateX(-120%);
    transition:transform .8s ease;
    z-index:-1;
  }
  .btn.primary:hover{
    transform:translateY(-2px);
    box-shadow:
      0 16px 40px -10px rgba(200,170,110,0.8),
      inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .btn.primary:hover::before{ transform:translateX(120%); }
  .btn.primary .icon{
    background:rgba(0,0,0,0.12);
    border-color:rgba(0,0,0,0.15);
  }
  .btn.primary .icon svg{ stroke:#0a0f14; }
  .btn.primary:hover .arrow{ transform:translateX(4px); opacity:1; }

  /* Secondary — YouTube */
  .btn.youtube{
    color:var(--gold-1);
    background:linear-gradient(180deg, rgba(20,32,52,0.9), rgba(8,18,32,0.9));
    border:1px solid rgba(200,170,110,0.28);
    box-shadow:
      0 8px 26px -10px rgba(0,0,0,0.9),
      inset 0 0 0 1px rgba(200,170,110,0.04);
  }
  .btn.youtube .icon{
    background:linear-gradient(135deg, #ff0033, #b1001f);
    border-color:rgba(255,255,255,0.18);
    box-shadow:0 0 18px rgba(255,0,51,0.35);
  }
  .btn.youtube .icon svg{ fill:#fff; }
  .btn.youtube::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg, rgba(10,200,185,0.10), transparent 60%);
    opacity:0;
    transition:opacity .35s ease;
    z-index:-1;
  }
  .btn.youtube:hover{
    transform:translateY(-2px);
    border-color:rgba(200,170,110,0.6);
    box-shadow:
      0 14px 34px -12px rgba(0,0,0,1),
      0 0 30px -8px rgba(255,0,51,0.35),
      inset 0 0 0 1px rgba(200,170,110,0.12);
  }
  .btn.youtube:hover::before{ opacity:1; }
  .btn.youtube:hover .arrow{ transform:translateX(4px); opacity:1; }

  .btn:active{ transform:translateY(0) scale(.985); }

  /* ===== Footer ===== */
  .footer{
    margin-top:26px;
    text-align:center;
    font-size:11px;
    letter-spacing:1.5px;
    color:rgba(200,170,110,0.5);
    text-transform:uppercase;
  }
  .footer b{
    color:var(--blue-1);
    font-weight:600;
  }

  @media (max-width:420px){
    .card{ padding:34px 22px 28px; border-radius:14px; }
    .logo{ width:82px; height:82px; }
    .logo svg{ width:44px; height:44px; }
    .btn{ padding:14px 16px; font-size:12.5px; gap:12px; }
    .btn .icon{ width:34px; height:34px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>

<main class="wrap">
  <section class="card">

    <div class="logo" aria-hidden="true">
      <!-- Hextech-style emblem -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff5dc"/>
            <stop offset="50%" stop-color="#c8aa6e"/>
            <stop offset="100%" stop-color="#785a28"/>
          </linearGradient>
          <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0ac8b9"/>
            <stop offset="100%" stop-color="#005a82"/>
          </linearGradient>
        </defs>
        <path d="M32 4 L56 18 V46 L32 60 L8 46 V18 Z" stroke="url(#gold)" stroke-width="2" fill="rgba(10,200,185,0.08)"/>
        <path d="M32 12 L48 21.5 V42.5 L32 52 L16 42.5 V21.5 Z" stroke="url(#teal)" stroke-width="1.4" fill="none" opacity="0.9"/>
        <path d="M32 22 L40 27 V37 L32 42 L24 37 V27 Z" fill="url(#gold)"/>
        <circle cx="32" cy="32" r="3" fill="#010a13"/>
      </svg>
    </div>

    <h1 class="brand">HAMMZYY</h1>
    <p class="tagline">Mod Skin • League of Legends</p>

    <div class="divider" aria-hidden="true"><span></span></div>

    <div class="actions">

      <!-- Download Mod Skin -->
      <a class="btn primary"
         href="https://link4m.net/lnAif"
         target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/>
            <path d="M7 10l5 5 5-5"/>
            <path d="M4 20h16"/>
          </svg>
        </span>
        <span class="label">Tải Mod Skin</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <!-- YouTube -->
      <a class="btn youtube"
         href="https://www.youtube.com/@hammzyysc"
         target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8zM9.6 15.6V8.4L15.8 12l-6.2 3.6z"/>
          </svg>
        </span>
        <span class="label">Kênh YouTube</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

    </div>

    <p class="footer">Made with <b>♥</b> for the Rift</p>

  </section>
</main>

</body>
</html>
